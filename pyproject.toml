[project]
name = "costex"
version = "0.1.0"
description = "Provable floating-point error bounds by equality saturation with interval-gated rewrites"
requires-python = ">=3.10"
dependencies = ["gmpy2>=2.2"]

[project.scripts]
costex = "costex.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["costex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
