[project]
name = "milo"
version = "0.1.0"
description = "Sound and optimal floating-point rewrites: extraction by error bound from an e-graph"
requires-python = ">=3.10"
dependencies = ["gmpy2>=2.2"]

[project.scripts]
milo = "milo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milo"]
